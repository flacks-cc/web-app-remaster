<div class="bg-dark text-center py-4">
    <h3 class="text-white m-0 fw-bolder">PRODUCTOS</h3>
</div>

<div class="container-fluid p-5">
    <div class="row d-flex justify-content-center">
        @for (product of products; track $index) {
        <div class="col-12 col-md-6 col-lg-3 text-center d-flex flex-column align-items-center p-4">
            <img [src]="product.images[0].imageUrl" class="mb-3 w-50" [alt]="product.name">
            <p class="m-0">{{ product.brand }}</p>
            <p class="m-0 fw-bold">{{ product.name }}</p>
            <p class="m-0">{{ product.description }}</p>
            <p class="m-0 fw-bold">Precio: ${{ product.price }}</p>
        </div>
        }
    </div>
</div>
