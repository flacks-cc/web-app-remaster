<div class="bg-dark text-center py-4">
    <h3 class="text-white m-0 fw-bolder">SERVICIOS</h3>
</div>

<div class="container-fluid p-5">
    <div class="row d-flex justify-content-center">
        @for (service of services; track $index) {
        <div class="col-12 col-md-6 col-lg-3 text-center d-flex flex-column align-items-center p-4">
            <img [src]="service.images[0].imageUrl" class="mb-3 w-50" [alt]="service.name">
            <p class="fw-bold">{{ service.name }}</p>
            <p>{{ service.description }}</p>
            <p class="m-0 fw-bold">Precio: ${{ service.price }}</p>
            <p class="m-0 fw-bold">Duración: {{ service.duration }} min</p>
        </div>
        }
    </div>
</div>
