<div class="min-vh-100 bg-dark d-flex flex-column justify-content-between px-3">
    <!-- Visible en pantallas grandes -->
    <div class="pt-3 px-2 text-center d-none d-lg-flex align-items-center">
        <a type="submit" class="text-decoration-none d-flex align-items-center justify-content-center">
            <img class="me-2" src="../../../../assets/img/logo.png" alt="" width="30">
            <span class="fs-6 fw-bolder d-none d-lg-inline text-warning">FLACK'S BARBER SHOP</span>
        </a>
    </div>
    <!-- Visible en pantallas pequeñas -->
    <div class="pt-3 px-2 text-center d-flex d-lg-none justify-content-center align-items-center">
        <a type="submit" class="text-decoration-none d-flex align-items-center" title="FLACK'S BARBER SHOP">
            <img class="me-2" src="./../../../../assets/images/logo-pepsico.png" alt="" width="30">
        </a>
    </div>

    <hr class="text-white">

    <ul class="nav nav-pills flex-column">
        <li class="nav-item mb-2">
            <a routerLink="/manage/services" class="nav-link text-white" routerLinkActive="active">
                <!-- Visible en pantallas grandes -->
                <div class="d-none d-lg-flex align-items-center">
                    <i class="bi bi-scissors me-3"></i>
                    <span class="d-none d-lg-inline">Servicios</span>
                </div>
                <!-- Visible en pantallas pequeñas -->
                <div class="d-flex d-lg-none justify-content-center align-items-center" title="Servicios">
                    <i class="bi bi-scissors me-0"></i>
                </div>
            </a>
        </li>
        <li class="nav-item mb-2">
            <a routerLink="/manage/products" class="nav-link text-white" routerLinkActive="active">
                <div class="d-none d-lg-flex align-items-center">
                    <i class="bi bi-tag-fill me-3"></i>
                    <span class="d-none d-lg-inline">Productos</span>
                </div>
                <div class="d-flex d-lg-none justify-content-center align-items-center" title="Productos">
                    <i class="bi bi-tag-fill me-0"></i>
                </div>
            </a>
        </li>
    </ul>

    <div class="mt-auto mb-3">
        <ul class="nav nav-pills flex-column">
            <li class="nav-item mb-2">
                <a routerLink="/home" type="submit" class="nav-link text-white">
                    <!-- Visible en pantallas grandes -->
                    <div class="d-none d-lg-flex align-items-center">
                        <i class="bi bi-house-door-fill me-3"></i>
                        <span class="d-none d-lg-inline">Volver al inicio</span>
                    </div>
                    <!-- Visible en pantallas pequeñas -->
                    <div class="d-flex d-lg-none justify-content-center align-items-center" title="Volver al inicio">
                        <i class="bi bi-house-door-fill me-0"></i>
                    </div>
                </a>
            </li>
            <li class="nav-item mb-2">
                <a (click)="logOut()" type="submit" class="nav-link text-white">
                    <!-- Visible en pantallas grandes -->
                    <div class="d-none d-lg-flex align-items-center">
                        <i class="bi bi-box-arrow-in-left me-3"></i>
                        <span class="d-none d-lg-inline">Cerrar sesión</span>
                    </div>
                    <!-- Visible en pantallas pequeñas -->
                    <div class="d-flex d-lg-none justify-content-center align-items-center" title="Cerrar sesión">
                        <i class="bi bi-box-arrow-in-left me-0"></i>
                    </div>
                </a>
            </li>
        </ul>
    </div>
</div>
