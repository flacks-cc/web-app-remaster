<body class="d-flex flex-column min-vh-100">
  @if (!isLoginRoute() && !isManageRoute()) {
  <app-navbar></app-navbar>
  }

  <div class="container-fluid h-100 d-flex flex-column p-0 overflow-hidden">
    @if (isManageRoute()) {
    <div class="row flex-grow-1">
      <!-- Sidebar -->
      <div class="col-2 d-flex flex-column position-fixed h-100 p-0">
        <app-sidebar></app-sidebar>
      </div>

      <!-- Main Content Area -->
      <div class="col-10 offset-2 d-flex flex-column flex-grow-1 p-0">
        <div class="container-fluid d-flex flex-column flex-grow-1 overflow-auto p-0">
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>
    } @else {
    <div class="row flex-grow-1">
      <!-- Main Content Area -->
      <div class="col-12 d-flex flex-column flex-grow-1 p-0">
        <div class="container-fluid d-flex flex-column flex-grow-1 overflow-auto p-0">
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>

    @if (!isLoginRoute()) {
      <a href="https://bit.ly/Whatsappflacks" target="_blank" class="position-fixed bottom-0 start-0 m-3 z-3" title="Reservar">
        <button class="btn btn-warning btn-lg rounded-circle" style="width: 70px; height: 70px;">
          <i class="bi bi-calendar-check" style="font-size: 1.5rem;"></i>
        </button>
      </a>
    }
    }

    <app-toast></app-toast>

    @if (!isLoginRoute() && !isManageRoute()) {
    <app-footer class="mt-auto"></app-footer>
    }
  </div>
</body>
